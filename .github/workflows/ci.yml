name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 빌드 실행
        run: |
          echo "🔨 빌드 시작..."
          cp src/app.sh app
          chmod +x app
          echo "빌드 완료!"
      - uses: actions/upload-artifact@v4
        with:
          name: app-binary
          path: app
          retention-days: 7

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: app-binary
      - name: 테스트 실행
        run: |
          echo "🧪 테스트 시작..."
          ls -la app
          sh tests/test.sh

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-binary
      - name: 패키지 실행
        run: |
          echo "📦 패키지 시작..."
          chmod +x app
          sh app

  # ── 개발 환경 배포 (develop 브랜치, 자동) ──
  deploy-dev:
    needs: package
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment:
      name: dev
      url: http://dev.example.internal
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-binary
      - name: dev 배포
        run: |
          echo "🚀 개발 서버 배포 중..."
          echo "커밋: ${{ github.sha }}"
          chmod +x app && sh app
          echo "dev 배포 완료!"

  # ── 운영 환경 배포 (main 브랜치, 승인 필요) ──
  deploy-prod:
    needs: package
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: prod
      url: http://example.com
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-binary
      - name: prod 배포
        run: |
          echo "🚀 운영 서버 배포 중..."
          echo "커밋: ${{ github.sha }}"
          chmod +x app && sh app
          echo "prod 배포 완료!"
