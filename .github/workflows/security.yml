name: Security Gate

on:
  push:
    branches: [ main ]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks 시크릿 스캔
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  vulnerability-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy IaC 스캔
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: './terraform'
          severity: HIGH,CRITICAL
          exit-code: '1'
